name: Repository snapshot

on:
  push:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 7
